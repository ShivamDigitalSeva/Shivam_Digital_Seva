<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>My Card - Shivam Digital Seva</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#e2e8f0;
  color:#111827;
}

header{
  background:linear-gradient(135deg,#111827,#1e40af);
  color:white;
  text-align:center;
  padding:25px 15px;
}

header h1{
  margin:0;
}

header p{
  margin:7px 0 0;
}

.container{
  max-width:550px;
  margin:25px auto;
  padding:15px;
}

.box{
  background:white;
  padding:22px;
  border-radius:18px;
  box-shadow:0 8px 25px rgba(0,0,0,.12);
}

h2{
  text-align:center;
}

input{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:1px solid #cbd5e1;
  border-radius:9px;
  font-size:16px;
}

button{
  width:100%;
  border:0;
  padding:14px;
  margin-top:15px;
  border-radius:9px;
  background:#2563eb;
  color:white;
  font-size:16px;
  font-weight:bold;
}

.message{
  margin-top:15px;
  text-align:center;
  font-weight:bold;
}

.error{
  color:#dc2626;
}

.success{
  color:#15803d;
}

.card{
  margin-top:20px;
  background:white;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,.18);
}

.card-top{
  background:linear-gradient(135deg,#2563eb,#1e40af);
  color:white;
  text-align:center;
  padding:25px;
}

.card-top h2{
  margin:0;
}

.card-body{
  padding:20px;
}

.row{
  background:#f8fafc;
  padding:13px;
  margin-bottom:10px;
  border-radius:9px;
}

.label{
  color:#64748b;
  font-size:13px;
}

.value{
  font-size:17px;
  font-weight:bold;
  margin-top:4px;
}

.active{
  color:#15803d;
}

.link{
  display:block;
  text-align:center;
  padding:13px;
  margin-top:15px;
  background:#2563eb;
  color:white;
  text-decoration:none;
  border-radius:9px;
  font-weight:bold;
}

.notice{
  margin-top:15px;
  padding:12px;
  background:#fff7ed;
  color:#9a3412;
  border-radius:8px;
  font-size:12px;
  text-align:center;
}

</style>

</head>

<body>

<header>

<h1>Shivam Digital Seva</h1>

<p>My Digital Service Card</p>

</header>


<div class="container">


<div class="box">

<h2>🪪 अपना Card देखें</h2>

<p style="text-align:center;color:#64748b;">
Application ID डालें
</p>


<input
  id="applicationId"
  type="text"
  placeholder="अपना Application ID डालें"
>


<button id="searchBtn">
  🔍 Card Status देखें
</button>


<div id="message"
     class="message">
</div>

</div>


<div id="cardArea"></div>


</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  signInAnonymously
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyAV-IvDV7MvzkfE_BxMnIoGt4HoPQOUogs",

  authDomain:
    "shivam-digital-seva.firebaseapp.com",

  projectId:
    "shivam-digital-seva",

  storageBucket:
    "shivam-digital-seva.firebasestorage.app",

  messagingSenderId:
    "142024656312",

  appId:
    "1:142024656312:web:ef0e26c1daacc62f21bb4d",

  measurementId:
    "G-45JZJSXRC7"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


const input =
  document.getElementById(
    "applicationId"
  );

const button =
  document.getElementById(
    "searchBtn"
  );

const message =
  document.getElementById(
    "message"
  );

const cardArea =
  document.getElementById(
    "cardArea"
  );


/*
  अगर user पहले Apply कर चुका है,
  तो उसका Application ID अपने-आप
  box में भर जाएगा।
*/

const savedId =
  localStorage.getItem(
    "shivamApplicationId"
  );

if(savedId){

  input.value = savedId;

}


button.addEventListener(
  "click",
  findCard
);


async function findCard(){

  const applicationId =
    input.value.trim();


  cardArea.innerHTML = "";

  message.textContent = "";


  if(!applicationId){

    message.className =
      "message error";

    message.textContent =
      "❌ Application ID डालें।";

    return;

  }


  button.disabled = true;

  button.textContent =
    "⏳ Check हो रहा है...";


  try{

    /*
      Anonymous login
      ताकि current Firestore Rules
      के साथ application read हो सके।
    */

    if(!auth.currentUser){

      await signInAnonymously(auth);

    }


    const applicationSnap =
      await getDoc(
        doc(
          db,
          "applications",
          applicationId
        )
      );


    if(!applicationSnap.exists()){

      message.className =
        "message error";

      message.textContent =
        "❌ Application ID नहीं मिला।";

      return;

    }


    const application =
      applicationSnap.data();


    /*
      Pending
    */

    if(application.status === "PENDING"){

      message.className =
        "message";

      message.style.color =
        "#92400e";

      message.textContent =
        "⏳ आपका आवेदन अभी Admin Approval में है।";

      return;

    }


    /*
      Rejected
    */

    if(application.status === "REJECTED"){

      message.className =
        "message error";

      message.textContent =
        "❌ आपका आवेदन Reject कर दिया गया है।";

      return;

    }


    /*
      Approved
    */

    if(
      application.status === "APPROVED" &&
      application.cardNumber
    ){

      const cardSnap =
        await getDoc(
          doc(
            db,
            "cards",
            applicationId
          )
        );


      if(!cardSnap.exists()){

        message.className =
          "message error";

        message.textContent =
          "❌ Card अभी उपलब्ध नहीं है।";

        return;

      }


      const card =
        cardSnap.data();


      if(card.status !== "ACTIVE"){

        message.className =
          "message error";

        message.textContent =
          "❌ Card Active नहीं है।";

        return;

      }


      showCard(
        card,
        applicationId
      );


      message.className =
        "message success";

      message.textContent =
        "✅ आपका Card Active है।";

      return;

    }


    message.className =
      "message error";

    message.textContent =
      "❌ Card की जानकारी उपलब्ध नहीं है।";


  }catch(error){

    console.error(error);

    message.className =
      "message error";

    message.textContent =
      "❌ Card देखने में समस्या हुई।";

  }finally{

    button.disabled = false;

    button.textContent =
      "🔍 Card Status देखें";

  }

}


/*
  SHOW CARD
*/

function showCard(
  data,
  cardId
){

  const cardUrl =
    window.location.origin +
    window.location.pathname
      .replace(
        "my-card.html",
        "card.html"
      ) +
    "?id=" +
    encodeURIComponent(cardId);


  const verifyUrl =
    window.location.origin +
    window.location.pathname
      .replace(
        "my-card.html",
        "verify.html"
      ) +
    "?id=" +
    encodeURIComponent(cardId);


  cardArea.innerHTML = `

    <div class="card">

      <div class="card-top">

        <h2>
          SHIVAM DIGITAL SEVA
        </h2>

        <p>
          DIGITAL SERVICE CARD
        </p>

      </div>


      <div class="card-body">

        <div class="row">

          <div class="label">
            नाम
          </div>

          <div class="value">
            ${escapeHTML(data.name)}
          </div>

        </div>


        <div class="row">

          <div class="label">
            Card Number
          </div>

          <div class="value">
            ${escapeHTML(data.cardNumber)}
          </div>

        </div>


        <div class="row">

          <div class="label">
            स्थान
          </div>

          <div class="value">
            ${escapeHTML(data.place)}
          </div>

        </div>


        <div class="row">

          <div class="label">
            Status
          </div>

          <div class="value active">
            🟢 ACTIVE
          </div>

        </div>


        <a
          href="${cardUrl}"
          class="link"
        >
          🪪 पूरा Card खोलें
        </a>


        <a
          href="${verifyUrl}"
          class="link"
        >
          🔍 Card Verification
        </a>


        <div class="notice">

          यह Shivam Digital Seva का
          Private Digital Service Card है।
          यह Aadhaar, PAN, Voter ID या
          सरकारी पहचान-पत्र नहीं है।

        </div>

      </div>

    </div>

  `;

}


function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

</script>

</body>
</html>

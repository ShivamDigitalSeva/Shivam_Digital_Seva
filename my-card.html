<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>My Card - Shivam Digital Seva</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(160deg,#eef2f9,#dbe4f0);
  color:#111827;
  min-height:100vh;
}

header{
  background:linear-gradient(120deg,#1e3a8a,#2563eb 60%,#3b82f6);
  color:white;
  text-align:center;
  padding:26px 15px;
}

header h1{
  margin:0;
  font-size:20px;
  letter-spacing:.5px;
}

header p{
  margin:6px 0 0;
  font-size:12px;
  letter-spacing:1px;
  opacity:.9;
}

.container{
  max-width:400px;
  margin:0 auto;
  padding:15px;
}

.box{
  background:white;
  padding:22px;
  border-radius:18px;
  box-shadow:0 8px 25px rgba(0,0,0,.1);
  margin-top:20px;
}

.box h2{
  text-align:center;
  margin-top:0;
  font-size:19px;
}

.box .sub{
  text-align:center;
  color:#64748b;
  font-size:13px;
  margin-top:-6px;
}

input{
  width:100%;
  padding:14px;
  margin-top:14px;
  border:1px solid #cbd5e1;
  border-radius:10px;
  font-size:15px;
}

button{
  width:100%;
  border:0;
  padding:14px;
  margin-top:14px;
  border-radius:10px;
  background:linear-gradient(120deg,#2563eb,#1e40af);
  color:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  margin-top:14px;
  text-align:center;
  font-weight:bold;
  font-size:14px;
}

.error{
  color:#dc2626;
}

.success{
  color:#15803d;
}

/* ===== ID CARD (preview) - Dark Premium ===== */

.card{
  position:relative;
  margin-top:20px;
  background:linear-gradient(150deg,#1c1f2e 0%,#12141f 55%,#0a0b12 100%);
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 20px 45px rgba(0,0,0,.4);
  border:1px solid #2c2f45;
  color:#e8e6df;
  padding:20px 20px 18px;
}

.card::before{
  content:"";
  position:absolute;
  top:-70px;
  right:-70px;
  width:200px;
  height:200px;
  background:radial-gradient(circle,rgba(212,175,55,.16),transparent 70%);
}

.card-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  position:relative;
  z-index:2;
}

.card-top h2{
  margin:0;
  font-size:13px;
  letter-spacing:1px;
  color:#f2e6c9;
}

.card-top p{
  margin:2px 0 0;
  font-size:8.5px;
  letter-spacing:2px;
  color:#8a8d9e;
}

.chip{
  width:34px;
  height:25px;
  border-radius:5px;
  background:linear-gradient(145deg,#e9d38a,#b8933f);
  border:1px solid #6f5a24;
  flex-shrink:0;
}

.card-number{
  margin-top:22px;
  font-family:'Courier New',monospace;
  font-size:16px;
  letter-spacing:2.5px;
  color:#f2e6c9;
  position:relative;
  z-index:2;
}

.card-bottom-row{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  margin-top:18px;
  position:relative;
  z-index:2;
}

.holder{
  display:flex;
  align-items:center;
  gap:9px;
}

.photo-circle{
  width:38px;
  height:38px;
  border-radius:50%;
  border:2px solid #d4af37;
  overflow:hidden;
  flex-shrink:0;
  background:#2c2f45;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:17px;
}

.photo-circle img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.card .label{
  font-size:8px;
  letter-spacing:1.5px;
  color:#8a8d9e;
  margin-bottom:2px;
}

.card .name{
  font-size:13px;
  font-weight:bold;
  color:#f5f3ec;
  text-transform:uppercase;
  margin:0;
}

.active{
  color:#7ee787;
  font-size:12px;
  font-weight:bold;
}

.place-row{
  margin-top:12px;
  padding-top:10px;
  border-top:1px solid #2c2f45;
  position:relative;
  z-index:2;
}

.place-row .value{
  font-size:12px;
  color:#e8e6df;
  margin-top:2px;
}

.card-actions{
  padding:16px 4px 2px;
}

.link{
  display:block;
  text-align:center;
  padding:12px;
  margin-top:10px;
  background:#eef2ff;
  color:#1e40af;
  text-decoration:none;
  border-radius:10px;
  font-weight:bold;
  font-size:14px;
}

.link.primary{
  background:linear-gradient(120deg,#2563eb,#1e40af);
  color:white;
}

.notice{
  margin-top:14px;
  padding:12px;
  background:#fff7ed;
  color:#9a3412;
  border-radius:10px;
  font-size:11.5px;
  text-align:center;
  line-height:1.6;
  border:1px dashed #fdba74;
}

</style>

</head>

<body>

<header>

<h1>🛡️ Shivam Digital Seva</h1>

<p>MY DIGITAL SERVICE CARD</p>

</header>


<div class="container">


<div class="box">

<h2>🪪 अपना Card देखें</h2>
<p class="sub">Application ID डालें</p>

<input
  id="applicationId"
  type="text"
  placeholder="अपना Application ID डालें"
>


<button id="searchBtn">
  🔍 Card Status देखें
</button>


<div id="message"
     class="message">
</div>

</div>


<div id="cardArea"></div>


</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  signInAnonymously
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyAV-IvDV7MvzkfE_BxMnIoGt4HoPQOUogs",

  authDomain:
    "shivam-digital-seva.firebaseapp.com",

  projectId:
    "shivam-digital-seva",

  storageBucket:
    "shivam-digital-seva.firebasestorage.app",

  messagingSenderId:
    "142024656312",

  appId:
    "1:142024656312:web:ef0e26c1daacc62f21bb4d",

  measurementId:
    "G-45JZJSXRC7"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


const input =
  document.getElementById(
    "applicationId"
  );

const button =
  document.getElementById(
    "searchBtn"
  );

const message =
  document.getElementById(
    "message"
  );

const cardArea =
  document.getElementById(
    "cardArea"
  );


/*
  अगर user पहले Apply कर चुका है,
  तो उसका Application ID अपने-आप
  box में भर जाएगा।
*/

const savedId =
  localStorage.getItem(
    "shivamApplicationId"
  );

if(savedId){

  input.value = savedId;

}


button.addEventListener(
  "click",
  findCard
);


async function findCard(){

  const applicationId =
    input.value.trim();


  cardArea.innerHTML = "";

  message.textContent = "";


  if(!applicationId){

    message.className =
      "message error";

    message.textContent =
      "❌ Application ID डालें।";

    return;

  }


  button.disabled = true;

  button.textContent =
    "⏳ Check हो रहा है...";


  try{

    /*
      Anonymous login
      ताकि current Firestore Rules
      के साथ application read हो सके।
    */

    if(!auth.currentUser){

      await signInAnonymously(auth);

    }


    const applicationSnap =
      await getDoc(
        doc(
          db,
          "applications",
          applicationId
        )
      );


    if(!applicationSnap.exists()){

      message.className =
        "message error";

      message.textContent =
        "❌ Application ID नहीं मिला।";

      return;

    }


    const application =
      applicationSnap.data();


    /*
      Pending
    */

    if(application.status === "PENDING"){

      message.className =
        "message";

      message.style.color =
        "#92400e";

      message.textContent =
        "⏳ आपका आवेदन अभी Admin Approval में है।";

      return;

    }


    /*
      Rejected
    */

    if(application.status === "REJECTED"){

      message.className =
        "message error";

      message.textContent =
        "❌ आपका आवेदन Reject कर दिया गया है।";

      return;

    }


    /*
      Approved
    */

    if(
      application.status === "APPROVED" &&
      application.cardNumber
    ){

      const cardSnap =
        await getDoc(
          doc(
            db,
            "cards",
            applicationId
          )
        );


      if(!cardSnap.exists()){

        message.className =
          "message error";

        message.textContent =
          "❌ Card अभी उपलब्ध नहीं है।";

        return;

      }


      const card =
        cardSnap.data();


      if(card.status !== "ACTIVE"){

        message.className =
          "message error";

        message.textContent =
          "❌ Card Active नहीं है।";

        return;

      }


      showCard(
        card,
        applicationId
      );


      message.className =
        "message success";

      message.textContent =
        "✅ आपका Card Active है।";

      return;

    }


    message.className =
      "message error";

    message.textContent =
      "❌ Card की जानकारी उपलब्ध नहीं है।";


  }catch(error){

    console.error(error);

    message.className =
      "message error";

    message.textContent =
      "❌ Card देखने में समस्या हुई।";

  }finally{

    button.disabled = false;

    button.textContent =
      "🔍 Card Status देखें";

  }

}


/*
  SHOW CARD
*/

function showCard(
  data,
  cardId
){

  const cardUrl =
    window.location.origin +
    window.location.pathname
      .replace(
        "my-card.html",
        "card.html"
      ) +
    "?id=" +
    encodeURIComponent(cardId);


  const verifyUrl =
    window.location.origin +
    window.location.pathname
      .replace(
        "my-card.html",
        "verify.html"
      ) +
    "?id=" +
    encodeURIComponent(cardId);


  const photoHTML =
    data.photo
      ? `<img src="${escapeHTML(data.photo)}" alt="फोटो">`
      : "👤";


  cardArea.innerHTML = `

    <div class="card">

      <div class="card-top">
        <div>
          <h2>🛡️ SHIVAM DIGITAL SEVA</h2>
          <p>DIGITAL SERVICE CARD</p>
        </div>
        <div class="chip"></div>
      </div>

      <div class="card-number">${escapeHTML(data.cardNumber)}</div>

      <div class="card-bottom-row">

        <div class="holder">

          <div class="photo-circle">
            ${photoHTML}
          </div>

          <div>
            <div class="label">CARD HOLDER</div>
            <p class="name">${escapeHTML(data.name)}</p>
          </div>

        </div>

        <div style="text-align:right">
          <div class="label">STATUS</div>
          <div class="active">● ACTIVE</div>
        </div>

      </div>

      <div class="place-row">
        <div class="label">स्थान / LOCATION</div>
        <div class="value">${escapeHTML(data.place)}</div>
      </div>

    </div>


    <div class="card-actions">

      <a
        href="${cardUrl}"
        class="link primary"
      >
        🪪 पूरा Card खोलें (QR + Print)
      </a>


      <a
        href="${verifyUrl}"
        class="link"
      >
        🔍 Card Verification
      </a>


      <div class="notice">
        यह Shivam Digital Seva का
        Private Digital Service Card है।
        यह Aadhaar, PAN, Voter ID या
        सरकारी पहचान-पत्र नहीं है।
      </div>

    </div>

  `;

}


function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

</script>

</body>
</html>

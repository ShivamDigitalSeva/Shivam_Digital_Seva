<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shivam Digital Seva Card Apply</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#111827;
}

header{
  background:linear-gradient(135deg,#2563eb,#1e40af);
  color:white;
  padding:25px 15px;
  text-align:center;
}

.container{
  max-width:650px;
  margin:25px auto;
  padding:15px;
}

.box{
  background:white;
  padding:25px;
  border-radius:16px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

h2{
  margin-top:0;
}

label{
  display:block;
  margin-top:15px;
  margin-bottom:6px;
  font-weight:bold;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #d1d5db;
  border-radius:8px;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  margin-top:20px;
  border:0;
  border-radius:9px;
  background:#2563eb;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#1d4ed8;
}

.notice{
  margin-top:15px;
  padding:12px;
  border-radius:8px;
  background:#fff7ed;
  color:#9a3412;
  font-size:13px;
}

#message{
  margin-top:15px;
  text-align:center;
  font-weight:bold;
}

.success{
  color:#15803d;
}

.error{
  color:#dc2626;
}
</style>
</head>

<body>

<header>
  <h1>Shivam Digital Seva</h1>
  <p>Shivam Digital Seva Card</p>
</header>

<div class="container">

<div class="box">

<h2>🪪 Card के लिए आवेदन करें</h2>

<label>पूरा नाम</label>
<input
  type="text"
  id="name"
  maxlength="80"
  placeholder="अपना पूरा नाम"
>

<label>मोबाइल नंबर</label>
<input
  type="tel"
  id="mobile"
  maxlength="10"
  inputmode="numeric"
  placeholder="10 अंकों का मोबाइल नंबर"
>

<label>गाँव / शहर</label>
<input
  type="text"
  id="place"
  maxlength="100"
  placeholder="गाँव / शहर"
>

<div class="notice">
  यह कार्ड Shivam Digital Seva का Private Digital Service Card है।
  यह Aadhaar, PAN, Voter ID या किसी सरकारी पहचान-पत्र का विकल्प नहीं है।
</div>

<button id="applyBtn">
  आवेदन जमा करें
</button>

<div id="message"></div>

</div>

</div>

  <script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  signInAnonymously
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey: "AIzaSyAV-IvDV7MvzkfE_BxMnIoGt4HoPQOUogs",

  authDomain: "shivam-digital-seva.firebaseapp.com",

  projectId: "shivam-digital-seva",

  storageBucket: "shivam-digital-seva.firebasestorage.app",

  messagingSenderId: "142024656312",

  appId: "1:142024656312:web:ef0e26c1daacc62f21bb4d",

  measurementId: "G-45JZJSXRC7"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


const applyBtn =
  document.getElementById("applyBtn");

const message =
  document.getElementById("message");


applyBtn.addEventListener("click", async function () {

  const name =
    document.getElementById("name").value.trim();

  const mobile =
    document.getElementById("mobile").value.trim();

  const place =
    document.getElementById("place").value.trim();


  if (!name || !mobile || !place) {

    message.innerHTML =
      "<span class='error'>कृपया सभी जानकारी भरें।</span>";

    return;
  }


  if (!/^[0-9]{10}$/.test(mobile)) {

    message.innerHTML =
      "<span class='error'>सही 10 अंकों का मोबाइल नंबर डालें।</span>";

    return;
  }


  applyBtn.disabled = true;

  applyBtn.innerText =
    "⏳ आवेदन भेजा जा रहा है...";


  try {

    // Anonymous Firebase Login
    const userCredential =
      await signInAnonymously(auth);

    const uid =
      userCredential.user.uid;


    // Firestore में Application
    await addDoc(
      collection(db, "applications"),
      {

        name: name,

        mobile: mobile,

        place: place,

        applicantUid: uid,

        status: "PENDING",

        createdAt: serverTimestamp()

      }
    );


    message.innerHTML =
      "<span class='success'>" +
      "✅ आवेदन सफलतापूर्वक जमा हो गया।" +
      "<br><br>" +
      "आपका आवेदन अब Admin Approval के लिए भेज दिया गया है।" +
      "</span>";


    document.getElementById("name").value = "";

    document.getElementById("mobile").value = "";

    document.getElementById("place").value = "";


  } catch (error) {

    console.error("Firebase Error:", error);

    message.innerHTML =
      "<span class='error'>" +
      "❌ आवेदन जमा नहीं हुआ।<br>" +
      error.message +
      "</span>";

  }


  applyBtn.disabled = false;

  applyBtn.innerText =
    "आवेदन जमा करें";

});

</script>
</body>
</html>

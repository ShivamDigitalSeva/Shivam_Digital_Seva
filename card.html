<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Shivam Digital Seva Card</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(160deg,#0b0f1a,#151a2b);
  min-height:100vh;
  padding:20px 0;
}

.container{
  max-width:400px;
  margin:10px auto;
  padding:15px;
}

/* ===== PREMIUM DARK CARD ===== */

.card{
  position:relative;
  background:linear-gradient(150deg,#1c1f2e 0%,#12141f 55%,#0a0b12 100%);
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 20px 45px rgba(0,0,0,.55);
  border:1px solid #2c2f45;
  color:#e8e6df;
  padding:22px 22px 20px;
}

.card::before{
  content:"";
  position:absolute;
  top:-70px;
  right:-70px;
  width:220px;
  height:220px;
  background:radial-gradient(circle,rgba(212,175,55,.16),transparent 70%);
}

.card::after{
  content:"";
  position:absolute;
  bottom:-90px;
  left:-60px;
  width:220px;
  height:220px;
  background:radial-gradient(circle,rgba(212,175,55,.08),transparent 70%);
}

.card-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  position:relative;
  z-index:2;
}

.brand{
  display:flex;
  align-items:center;
  gap:8px;
}

.brand-icon{
  font-size:20px;
}

.brand h1{
  margin:0;
  font-size:13.5px;
  letter-spacing:1px;
  color:#f2e6c9;
}

.brand p{
  margin:2px 0 0;
  font-size:9px;
  letter-spacing:2px;
  color:#8a8d9e;
}

.chip{
  width:38px;
  height:28px;
  border-radius:6px;
  background:linear-gradient(145deg,#e9d38a,#b8933f);
  border:1px solid #6f5a24;
  position:relative;
  z-index:2;
  flex-shrink:0;
}

.chip::before{
  content:"";
  position:absolute;
  inset:5px;
  border:1px solid rgba(0,0,0,.35);
  border-radius:3px;
}

.card-number{
  margin-top:24px;
  font-family:'Courier New',monospace;
  font-size:18px;
  letter-spacing:3px;
  color:#f2e6c9;
  text-shadow:0 1px 1px rgba(0,0,0,.4);
  position:relative;
  z-index:2;
}

.card-bottom-row{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  margin-top:20px;
  position:relative;
  z-index:2;
}

.holder{
  display:flex;
  align-items:center;
  gap:10px;
}

.photo-circle{
  width:44px;
  height:44px;
  border-radius:50%;
  border:2px solid #d4af37;
  overflow:hidden;
  flex-shrink:0;
  background:#2c2f45;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
}

.photo-circle img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.holder .label,
.status-block .label{
  font-size:8.5px;
  letter-spacing:1.5px;
  color:#8a8d9e;
  margin-bottom:3px;
}

.holder .value{
  font-size:14px;
  font-weight:bold;
  letter-spacing:.5px;
  color:#f5f3ec;
  text-transform:uppercase;
}

.status-block{
  text-align:right;
}

.status-block .value{
  font-size:13px;
  font-weight:bold;
  color:#7ee787;
}

.place-row{
  margin-top:14px;
  padding-top:12px;
  border-top:1px solid #2c2f45;
  position:relative;
  z-index:2;
}

.place-row .label{
  font-size:8.5px;
  letter-spacing:1.5px;
  color:#8a8d9e;
  margin-bottom:3px;
}

.place-row .value{
  font-size:13px;
  color:#e8e6df;
}

/* ===== BELOW CARD (QR + actions) ===== */

.below{
  background:#ffffff;
  border-radius:0 0 20px 20px;
  margin-top:-20px;
  padding-top:28px;
  padding-bottom:20px;
  box-shadow:0 20px 45px rgba(0,0,0,.15);
}

#qrcode{
  text-align:center;
  display:flex;
  justify-content:center;
}

#qrcode > div,
#qrcode img{
  padding:10px;
  background:white;
  border:1px solid #e2e8f0;
  border-radius:14px;
}

.qr-caption{
  text-align:center;
  font-size:11px;
  color:#94a3b8;
  margin:8px 0 14px;
}

.notice{
  background:#fff7ed;
  color:#9a3412;
  padding:12px;
  margin:0 22px;
  border-radius:10px;
  font-size:11.5px;
  text-align:center;
  line-height:1.6;
  border:1px dashed #fdba74;
}

.btn-row{
  display:flex;
  gap:10px;
  margin:14px 22px 0;
}

button{
  flex:1;
  border:0;
  padding:13px 8px;
  border-radius:12px;
  font-weight:bold;
  font-size:14px;
  cursor:pointer;
}

#printButton{
  background:#eef2ff;
  color:#1e293b;
}

#downloadButton{
  background:linear-gradient(120deg,#151a2b,#0a0b12);
  color:#f2e6c9;
  border:1px solid #2c2f45;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.error{
  text-align:center;
  color:#dc2626;
  font-weight:bold;
  background:white;
  padding:30px 20px;
  border-radius:18px;
  box-shadow:0 10px 25px rgba(0,0,0,.1);
}

#loading{
  text-align:center;
  color:#cbd5e1;
  font-weight:bold;
  padding:30px;
}

@media print{

  body{
    background:white;
    padding:0;
  }

  .container{
    margin:0;
    max-width:400px;
  }

  .btn-row{
    display:none;
  }

  .card,
  .below{
    box-shadow:none;
  }

}

</style>

<!-- Card Download -->
<script
src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
</script>

</head>

<body>

<div class="container">

  <div id="loading">
    ⏳ Card लोड हो रहा है...
  </div>

  <div id="cardArea"></div>

</div>


<!-- QR Code -->
<script
src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
</script>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyAV-IvDV7MvzkfE_BxMnIoGt4HoPQOUogs",

  authDomain:
    "shivam-digital-seva.firebaseapp.com",

  projectId:
    "shivam-digital-seva",

  storageBucket:
    "shivam-digital-seva.firebasestorage.app",

  messagingSenderId:
    "142024656312",

  appId:
    "1:142024656312:web:ef0e26c1daacc62f21bb4d",

  measurementId:
    "G-45JZJSXRC7"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);


/* =========================
   CARD ID
========================= */

const params =
  new URLSearchParams(
    window.location.search
  );

const cardId =
  params.get("id");


const loading =
  document.getElementById("loading");

const cardArea =
  document.getElementById("cardArea");


/* =========================
   LOAD CARD
========================= */

async function loadCard(){

  if(!cardId){

    showError(
      "Invalid Card Link"
    );

    return;
  }


  try{

    const snap =
      await getDoc(
        doc(db,"cards",cardId)
      );


    if(!snap.exists()){

      showError(
        "Card नहीं मिला।"
      );

      return;
    }


    const data =
      snap.data();


    /* केवल ACTIVE CARD */

    if(
      String(data.status || "")
        .toUpperCase() !== "ACTIVE"
    ){

      showError(
        "यह Card Active नहीं है।"
      );

      return;
    }


    loading.style.display =
      "none";


    const photoHTML =
      data.photo
        ? `<img src="${data.photo}" alt="फोटो">`
        : "👤";


    /* =========================
       CARD HTML
    ========================= */

    cardArea.innerHTML = `

      <div class="card" id="digitalCard">

        <div class="card-top">

          <div class="brand">
            <span class="brand-icon">🛡️</span>
            <div>
              <h1>SHIVAM DIGITAL SEVA</h1>
              <p>DIGITAL SERVICE CARD</p>
            </div>
          </div>

          <div class="chip"></div>

        </div>


        <div class="card-number">${escapeHTML(data.cardNumber)}</div>


        <div class="card-bottom-row">

          <div class="holder">

            <div class="photo-circle">
              ${photoHTML}
            </div>

            <div>
              <div class="label">CARD HOLDER</div>
              <div class="value">${escapeHTML(data.name)}</div>
            </div>

          </div>

          <div class="status-block">
            <div class="label">STATUS</div>
            <div class="value">● ACTIVE</div>
          </div>

        </div>


        <div class="place-row">
          <div class="label">स्थान / LOCATION</div>
          <div class="value">${escapeHTML(data.place)}</div>
        </div>

      </div>


      <div class="below">

        <div id="qrcode"></div>
        <div class="qr-caption">स्कैन करके Card Verify करें</div>


        <div class="notice">
          PRIVATE DIGITAL SERVICE CARD<br>
          यह Aadhaar, PAN, Voter ID या
          सरकारी पहचान-पत्र नहीं है।
        </div>


        <div class="btn-row">

          <button
            id="printButton"
            onclick="window.print()">
            🖨️ Print
          </button>

          <button
            id="downloadButton"
            onclick="downloadCard()">
            📥 Download
          </button>

        </div>

      </div>

    `;


    /* =========================
       VERIFY URL
    ========================= */

    const verifyUrl =
      window.location.origin +
      window.location.pathname
        .replace(
          "card.html",
          "verify.html"
        ) +
      "?id=" +
      encodeURIComponent(cardId);


    /* =========================
       QR CODE
    ========================= */

    const qrBox =
      document.getElementById("qrcode");


    if(qrBox){

      new QRCode(
        qrBox,
        {
          text:verifyUrl,
          width:130,
          height:130
        }
      );

    }


  }catch(error){

    console.error(error);

    showError(
      "Card load करने में समस्या हुई।"
    );

  }

}


/* =========================
   ERROR
========================= */

function showError(text){

  loading.style.display =
    "none";

  cardArea.innerHTML =
    `
    <div class="error">

      ❌ ${escapeHTML(text)}

    </div>
    `;

}


/* =========================
   HTML SECURITY
========================= */

function escapeHTML(value){

  return String(value ?? "")

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================
   DOWNLOAD CARD
========================= */

window.downloadCard =
async function(){

  const card =
    document.getElementById(
      "digitalCard"
    );


  const button =
    document.getElementById(
      "downloadButton"
    );


  if(!card){

    alert(
      "❌ Card अभी लोड नहीं हुआ है।"
    );

    return;
  }


  if(!button){

    return;
  }


  button.disabled = true;

  button.textContent =
    "⏳ तैयार हो रहा है...";


  try{

    const canvas =
      await html2canvas(
        card,
        {
          scale:2,
          backgroundColor:"#12141f",
          useCORS:true
        }
      );


    const link =
      document.createElement("a");


    const cardNumber =
      card.querySelector(
        ".card-number"
      )?.textContent
        ?.trim()
        .replace(
          /[^a-zA-Z0-9_-]/g,
          "_"
        ) ||
      "Card";


    link.download =
      "Shivam-Digital-Seva-" +
      cardNumber +
      ".png";


    link.href =
      canvas.toDataURL(
        "image/png"
      );


    document.body.appendChild(link);

    link.click();

    link.remove();


  }catch(error){

    console.error(error);

    alert(
      "❌ Card Download नहीं हो पाया।"
    );

  }finally{

    button.disabled = false;

    button.textContent =
      "📥 Download";

  }

};


/* =========================
   START
========================= */

loadCard();

</script>

</body>

</html>

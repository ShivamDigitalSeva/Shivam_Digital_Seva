<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Shivam Digital Seva Card</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(160deg,#eef2f9,#dbe4f0);
  min-height:100vh;
  padding:20px 0;
}

.container{
  max-width:400px;
  margin:10px auto;
  padding:15px;
}

/* ===== ID CARD ===== */

.card{
  position:relative;
  background:#ffffff;
  border-radius:22px;
  overflow:hidden;
  box-shadow:0 15px 35px rgba(30,64,175,.25);
  border:1px solid #dbe4f0;
}

.top{
  position:relative;
  background:linear-gradient(120deg,#1e3a8a,#2563eb 60%,#3b82f6);
  color:white;
  text-align:center;
  padding:22px 20px 55px;
  overflow:hidden;
}

.top::before{
  content:"";
  position:absolute;
  top:-40px;
  right:-40px;
  width:140px;
  height:140px;
  background:rgba(255,255,255,.08);
  border-radius:50%;
}

.top::after{
  content:"";
  position:absolute;
  bottom:-60px;
  left:-30px;
  width:160px;
  height:160px;
  background:rgba(255,255,255,.06);
  border-radius:50%;
}

.top .brand{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  position:relative;
  z-index:2;
}

.top .brand-icon{
  font-size:22px;
}

.top h1{
  margin:0;
  font-size:17px;
  letter-spacing:.5px;
}

.top p{
  margin:4px 0 0;
  font-size:11px;
  letter-spacing:2px;
  opacity:.9;
  position:relative;
  z-index:2;
}

/* Avatar overlapping header/body */

.avatar-wrap{
  position:relative;
  margin-top:-42px;
  display:flex;
  justify-content:center;
  z-index:3;
}

.avatar{
  width:84px;
  height:84px;
  border-radius:50%;
  background:linear-gradient(145deg,#e2e8f0,#cbd5e1);
  border:4px solid #ffffff;
  box-shadow:0 6px 16px rgba(0,0,0,.18);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
}

.body{
  padding:14px 22px 24px;
  text-align:center;
}

.name{
  font-size:20px;
  font-weight:bold;
  color:#0f172a;
  margin-top:6px;
}

.card-id{
  display:inline-block;
  margin-top:6px;
  background:#eef2ff;
  color:#1e40af;
  font-weight:bold;
  letter-spacing:1px;
  padding:5px 14px;
  border-radius:20px;
  font-size:13px;
}

.divider{
  height:1px;
  background:repeating-linear-gradient(90deg,#cbd5e1 0 6px,transparent 6px 12px);
  margin:18px 0 14px;
}

.info-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  text-align:left;
}

.info-grid .full{
  grid-column:1/-1;
}

.row{
  padding:10px 12px;
  background:#f8fafc;
  border-radius:10px;
  border:1px solid #eef1f5;
}

.label{
  color:#64748b;
  font-size:11px;
  margin-bottom:3px;
  display:flex;
  align-items:center;
  gap:4px;
}

.value{
  font-size:14.5px;
  font-weight:bold;
  color:#0f172a;
  word-break:break-word;
}

.active{
  color:#15803d;
}

#qrcode{
  text-align:center;
  margin:20px 0 6px;
  display:flex;
  justify-content:center;
}

#qrcode > div,
#qrcode img{
  padding:10px;
  background:white;
  border:1px solid #e2e8f0;
  border-radius:14px;
}

.qr-caption{
  text-align:center;
  font-size:11px;
  color:#94a3b8;
  margin-bottom:10px;
}

.notice{
  background:#fff7ed;
  color:#9a3412;
  padding:12px;
  border-radius:10px;
  font-size:11.5px;
  text-align:center;
  line-height:1.6;
  border:1px dashed #fdba74;
}

.btn-row{
  display:flex;
  gap:10px;
  margin-top:14px;
}

button{
  flex:1;
  border:0;
  padding:13px 8px;
  border-radius:12px;
  font-weight:bold;
  font-size:14px;
  cursor:pointer;
}

#printButton{
  background:#eef2ff;
  color:#1e40af;
}

#downloadButton{
  background:linear-gradient(120deg,#2563eb,#1e40af);
  color:white;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.error{
  text-align:center;
  color:#dc2626;
  font-weight:bold;
  background:white;
  padding:30px 20px;
  border-radius:18px;
  box-shadow:0 10px 25px rgba(0,0,0,.1);
}

#loading{
  text-align:center;
  color:#475569;
  font-weight:bold;
  padding:30px;
}

@media print{

  body{
    background:white;
    padding:0;
  }

  .container{
    margin:0;
    max-width:400px;
  }

  .btn-row{
    display:none;
  }

  .card{
    box-shadow:none;
  }

}

</style>

<!-- Card Download -->
<script
src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
</script>

</head>

<body>

<div class="container">

  <div id="loading">
    ⏳ Card लोड हो रहा है...
  </div>

  <div id="cardArea"></div>

</div>


<!-- QR Code -->
<script
src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
</script>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyAV-IvDV7MvzkfE_BxMnIoGt4HoPQOUogs",

  authDomain:
    "shivam-digital-seva.firebaseapp.com",

  projectId:
    "shivam-digital-seva",

  storageBucket:
    "shivam-digital-seva.firebasestorage.app",

  messagingSenderId:
    "142024656312",

  appId:
    "1:142024656312:web:ef0e26c1daacc62f21bb4d",

  measurementId:
    "G-45JZJSXRC7"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);


/* =========================
   CARD ID
========================= */

const params =
  new URLSearchParams(
    window.location.search
  );

const cardId =
  params.get("id");


const loading =
  document.getElementById("loading");

const cardArea =
  document.getElementById("cardArea");


/* =========================
   LOAD CARD
========================= */

async function loadCard(){

  if(!cardId){

    showError(
      "Invalid Card Link"
    );

    return;
  }


  try{

    const snap =
      await getDoc(
        doc(db,"cards",cardId)
      );


    if(!snap.exists()){

      showError(
        "Card नहीं मिला।"
      );

      return;
    }


    const data =
      snap.data();


    /* केवल ACTIVE CARD */

    if(
      String(data.status || "")
        .toUpperCase() !== "ACTIVE"
    ){

      showError(
        "यह Card Active नहीं है।"
      );

      return;
    }


    loading.style.display =
      "none";


    /* =========================
       CARD HTML
    ========================= */

    cardArea.innerHTML = `

      <div class="card" id="digitalCard">

        <div class="top">
          <div class="brand">
            <span class="brand-icon">🛡️</span>
            <h1>SHIVAM DIGITAL SEVA</h1>
          </div>
          <p>DIGITAL SERVICE CARD</p>
        </div>

        <div class="avatar-wrap">
          <div class="avatar">👤</div>
        </div>

        <div class="body">

          <div class="name">${escapeHTML(data.name)}</div>
          <div class="card-id">🪪 ${escapeHTML(data.cardNumber)}</div>

          <div class="divider"></div>

          <div class="info-grid">

            <div class="row full">
              <div class="label">📍 स्थान</div>
              <div class="value">${escapeHTML(data.place)}</div>
            </div>

            <div class="row full">
              <div class="label">स्थिति</div>
              <div class="value active">✅ ACTIVE</div>
            </div>

          </div>


          <div id="qrcode"></div>
          <div class="qr-caption">स्कैन करके Card Verify करें</div>


          <div class="notice">
            PRIVATE DIGITAL SERVICE CARD<br>
            यह Aadhaar, PAN, Voter ID या
            सरकारी पहचान-पत्र नहीं है।
          </div>


          <div class="btn-row">

            <button
              id="printButton"
              onclick="window.print()">
              🖨️ Print
            </button>

            <button
              id="downloadButton"
              onclick="downloadCard()">
              📥 Download
            </button>

          </div>

        </div>

      </div>

    `;


    /* =========================
       VERIFY URL
    ========================= */

    const verifyUrl =
      window.location.origin +
      window.location.pathname
        .replace(
          "card.html",
          "verify.html"
        ) +
      "?id=" +
      encodeURIComponent(cardId);


    /* =========================
       QR CODE
    ========================= */

    const qrBox =
      document.getElementById("qrcode");


    if(qrBox){

      new QRCode(
        qrBox,
        {
          text:verifyUrl,
          width:130,
          height:130
        }
      );

    }


  }catch(error){

    console.error(error);

    showError(
      "Card load करने में समस्या हुई।"
    );

  }

}


/* =========================
   ERROR
========================= */

function showError(text){

  loading.style.display =
    "none";

  cardArea.innerHTML =
    `
    <div class="error">

      ❌ ${escapeHTML(text)}

    </div>
    `;

}


/* =========================
   HTML SECURITY
========================= */

function escapeHTML(value){

  return String(value ?? "")

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================
   DOWNLOAD CARD
========================= */

window.downloadCard =
async function(){

  const card =
    document.getElementById(
      "digitalCard"
    );


  const button =
    document.getElementById(
      "downloadButton"
    );


  if(!card){

    alert(
      "❌ Card अभी लोड नहीं हुआ है।"
    );

    return;
  }


  if(!button){

    return;
  }


  button.disabled = true;

  button.textContent =
    "⏳ तैयार हो रहा है...";


  try{

    const canvas =
      await html2canvas(
        card,
        {
          scale:2,
          backgroundColor:"#ffffff",
          useCORS:true
        }
      );


    const link =
      document.createElement("a");


    const cardNumber =
      card.querySelector(
        ".card-id"
      )?.textContent
        ?.trim()
        .replace(
          /[^a-zA-Z0-9_-]/g,
          "_"
        ) ||
      "Card";


    link.download =
      "Shivam-Digital-Seva-" +
      cardNumber +
      ".png";


    link.href =
      canvas.toDataURL(
        "image/png"
      );


    document.body.appendChild(link);

    link.click();

    link.remove();


  }catch(error){

    console.error(error);

    alert(
      "❌ Card Download नहीं हो पाया।"
    );

  }finally{

    button.disabled = false;

    button.textContent =
      "📥 Download";

  }

};


/* =========================
   START
========================= */

loadCard();

</script>

</body>

</html>
